[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "keel-legal-preview"
version = "0.1.0.dev7"
requires-python = ">=3.12"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = ["PyYAML>=6,<7", "httpx>=0.27,<1"]
[project.scripts]
keel-preview = "keel.cli:main"
[tool.setuptools.packages.find]
include = ["keel*"]
[tool.setuptools.package-data]
"keel" = ["skills/builtin/*/SKILL.md", "ui/web/static/index.html"]
